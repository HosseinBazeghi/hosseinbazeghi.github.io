<!doctype html>
<html lang="{{ site.locale | slice: 0, 2 | default: 'en' }}">
  <head>{% include head.html %}</head>
  <body>
    {% include header.html %}
    <main id="main-content">{{ content }}</main>
    {% include footer.html %}
    <div class="lightbox" role="dialog" aria-modal="true" aria-label="Image preview" aria-hidden="true" data-lightbox>
      <button class="lightbox__close" type="button" aria-label="Close image preview" data-lightbox-close>×</button>
      <img alt="" data-lightbox-image>
      <p data-lightbox-caption></p>
    </div>
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
