---
layout: default
---
<article class="page-shell shell prose-page">
  <header class="page-heading">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="page-deck">{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose{% if page.wide %} prose--wide{% endif %}">{{ content }}</div>
</article>
