<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fafaf7" data-theme-color>
<script>
  (function () {
    document.documentElement.classList.add('js');
    var theme = 'light';
    try {
      var saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        theme = saved;
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        theme = 'dark';
      }
    } catch (error) {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
    }
    document.documentElement.dataset.theme = theme;
    document.querySelector('[data-theme-color]').setAttribute('content', theme === 'dark' ? '#0e1820' : '#fafaf7');
  }());
</script>
{% seo %}
<link rel="icon" href="{{ '/assets/images/hk-circle.png' | relative_url }}" type="image/png" sizes="256x256">
<link rel="preload" href="{{ '/assets/css/main.css' | relative_url }}" as="style">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
{% if page.math %}
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
