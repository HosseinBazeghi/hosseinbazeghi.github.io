<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f3ed" data-theme-color>
<script>
  (function () {
    var theme = 'light';
    try {
      var saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        theme = saved;
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        theme = 'dark';
      }
    } catch (error) {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
    }
    document.documentElement.dataset.theme = theme;
    document.querySelector('[data-theme-color]').setAttribute('content', theme === 'dark' ? '#0e1820' : '#f5f3ed');
  }());
</script>
{% seo %}
{% assign social_image = page.image | default: site.default_social_image %}
{% if social_image %}
  <meta property="og:image" content="{{ social_image | absolute_url }}">
  <meta name="twitter:image" content="{{ social_image | absolute_url }}">
{% endif %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
<link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preload" href="{{ '/assets/css/main.css' | relative_url }}" as="style">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
{% if page.math or page.layout == 'post' %}
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
