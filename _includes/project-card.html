{% assign project = include.project %}
<article class="project-card reveal">
  <a class="project-card__image" href="{{ project.url | relative_url }}" tabindex="-1" aria-hidden="true">
    <img src="{{ project.image | relative_url }}" alt="" loading="lazy" width="960" height="640">
  </a>
  <div class="project-card__body">
    <div class="meta-row">
      <span>{{ project.date_range }}</span>
      {% if project.status %}<span class="status-pill">{{ project.status }}</span>{% endif %}
    </div>
    <h3><a href="{{ project.url | relative_url }}">{{ project.title }}</a></h3>
    <p>{{ project.description }}</p>
    {% if project.tools %}<ul class="tag-list" aria-label="Tools used">{% for tool in project.tools %}<li>{{ tool }}</li>{% endfor %}</ul>{% endif %}
    <a class="text-link" href="{{ project.url | relative_url }}">Read more <span aria-hidden="true">→</span></a>
  </div>
</article>
