- title: Soil–structure interaction
  description: Coupled soil, foundation, and structural response under earthquake loading, including nonlinear soil and deformable foundations.
- title: Seismic waves & ground motion
  description: Wave propagation, near-fault pulse-like motions, and strong-motion characteristics in records from Iran and Yunnan, China.
- title: Computational & field methods
