<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Demo method comparison</title>
  <desc id="desc">A line chart where the proposed method outperforms two baselines as the number of observations increases</desc>
  <rect width="1200" height="700" rx="24" fill="#f8f6ef"/>
  <text x="100" y="78" fill="#173243" font-family="Georgia, serif" font-size="39">Validation performance by sample size</text>
  <text x="100" y="117" fill="#65737b" font-family="Arial, sans-serif" font-size="19">Illustrative data — replace with your results</text>
  <g stroke="#d7d3c9" stroke-width="2">
    <path d="M130 180H1080M130 270H1080M130 360H1080M130 450H1080M130 540H1080"/>
    <path d="M130 180V540M330 180V540M530 180V540M730 180V540M930 180V540" stroke-dasharray="5 8"/>
  </g>
  <g fill="#65737b" font-family="Arial, sans-serif" font-size="17">
    <text x="94" y="546">0.4</text><text x="94" y="456">0.5</text><text x="94" y="366">0.6</text><text x="94" y="276">0.7</text><text x="94" y="186">0.8</text>
    <text x="124" y="580">100</text><text x="318" y="580">250</text><text x="515" y="580">500</text><text x="710" y="580">1,000</text><text x="910" y="580">2,000</text>
    <text x="600" y="635" text-anchor="middle" font-size="20">Number of observations</text>
    <text x="34" y="360" text-anchor="middle" font-size="20" transform="rotate(-90 34 360)">Validation score</text>
  </g>
  <path d="M130 466L330 398L530 319L730 247L930 202" fill="none" stroke="#08776f" stroke-width="9"/>
  <path d="M130 502L330 452L530 408L730 354L930 318" fill="none" stroke="#ad5b36" stroke-width="6"/>
  <path d="M130 525L330 490L530 454L730 425L930 390" fill="none" stroke="#748089" stroke-width="6" stroke-dasharray="13 10"/>
  <g fill="#08776f"><circle cx="130" cy="466" r="9"/><circle cx="330" cy="398" r="9"/><circle cx="530" cy="319" r="9"/><circle cx="730" cy="247" r="9"/><circle cx="930" cy="202" r="9"/></g>
  <g font-family="Arial, sans-serif" font-size="18"><path d="M785 94h42" stroke="#08776f" stroke-width="8"/><text x="840" y="101" fill="#173243">Proposed</text><path d="M935 94h42" stroke="#ad5b36" stroke-width="6"/><text x="990" y="101" fill="#173243">Baseline A</text><path d="M785 132h42" stroke="#748089" stroke-width="6" stroke-dasharray="10 7"/><text x="840" y="139" fill="#173243">Baseline B</text></g>
</svg>

