<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Reproducible research pipeline</title>
  <desc id="desc">Five connected stages: question, data, model, validate, and communicate</desc>
  <rect width="1200" height="620" rx="24" fill="#f8f6ef"/>
  <path d="M170 310H1030" stroke="#b9c6c7" stroke-width="6"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(170 310)"><circle r="72" fill="#173243"/><text y="6" fill="#fff" font-size="23" font-weight="700">Question</text><text y="130" fill="#50616b" font-size="19">Define</text></g>
    <g transform="translate(385 310)"><circle r="72" fill="#0d736d"/><text y="6" fill="#fff" font-size="23" font-weight="700">Data</text><text y="130" fill="#50616b" font-size="19">Observe</text></g>
    <g transform="translate(600 310)"><circle r="72" fill="#ad5b36"/><text y="6" fill="#fff" font-size="23" font-weight="700">Model</text><text y="130" fill="#50616b" font-size="19">Explain</text></g>
    <g transform="translate(815 310)"><circle r="72" fill="#0d736d"/><text y="6" fill="#fff" font-size="23" font-weight="700">Validate</text><text y="130" fill="#50616b" font-size="19">Test</text></g>
    <g transform="translate(1030 310)"><circle r="72" fill="#173243"/><text y="-6" fill="#fff" font-size="20" font-weight="700">Communi-</text><text y="21" fill="#fff" font-size="20" font-weight="700">cate</text><text y="130" fill="#50616b" font-size="19">Share</text></g>
  </g>
  <text x="600" y="80" fill="#173243" font-family="Georgia, serif" font-size="40" text-anchor="middle">A traceable path from question to evidence</text>
</svg>

