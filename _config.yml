# ------------------------------------------------------------
# Site-wide identity — start customizing here.
# ------------------------------------------------------------
title: "Hossein Bazeghi Kisomi"
tagline: "PhD Candidate · Earthquake Engineering"
description: "Academic website of Hossein Bazeghi Kisomi, a PhD candidate at Tianjin University researching soil–structure interaction, wave propagation, and strong ground motion."
url: "https://hosseinbazeghi.github.io"
baseurl: "" # For a project site, use "/YOUR-REPOSITORY". For a user site, keep this empty.
repository: "HosseinBazeghi/hosseinbazeghi.github.io"
locale: "en_US"
timezone: "Etc/UTC"

author:
  name: "Hossein Bazeghi Kisomi"
  title: "PhD Candidate · Earthquake Engineering"
  institution: "Tianjin University"
  email: "bazeghi.hossein@gmail.com"
  location: "Tianjin, China"
  bio: "I am a PhD candidate in Tianjin University's Strong Motion Observation and Simulation Laboratory, where I investigate soil–structure interaction, seismic wave propagation, and strong ground motion through earthquake-engineering analysis and numerical modeling."
  profile_image: "/assets/images/hossein-bazeghi-kisomi.png"
  profile_image_alt: "Portrait of Hossein Bazeghi Kisomi"

social:
  github: "https://github.com/HosseinBazeghi"
  linkedin: "https://www.linkedin.com/in/hossein-bazeghi-kisomi-71a78379/"
  researchgate: "https://www.researchgate.net/profile/Hossein-Bazeghi-Kisomi?ev=hdr_xprf"
  google_scholar: "https://scholar.google.com/citations?user=nd6QsZEAAAAJ&hl=en"
  orcid: "https://orcid.org/0000-0002-2832-7174"

cv_path: "/assets/documents/cv.pdf"
default_social_image: "/assets/images/academic-og.png"

# ------------------------------------------------------------
# Jekyll behavior
# ------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/
future: false

kramdown:
  input: GFM
  syntax_highlighter: rouge
  footnote_nr: 1

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "Hossein Bazeghi Kisomi"
      toc: true
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project

pagination:
  enabled: true
  per_page: 6
  permalink: "/page/:num/"
  sort_reverse: true
  title: ":title — page :num"

plugins:
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
